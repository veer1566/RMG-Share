name: Import RMG Share source
on:
  push:
    paths:
      - '.bootstrap/RMG-source.xz.b64'
permissions:
  contents: write
jobs:
  import:
    if: github.repository == 'veer1566/RMG-Share'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Restore RMG Share project
        shell: bash
        run: |
          python3 - <<'PY'
          import base64,io,lzma,tarfile,pathlib
          p=pathlib.Path(".bootstrap/RMG-source.xz.b64")
          content=lzma.decompress(base64.b64decode(p.read_text().strip()))
          with tarfile.open(fileobj=io.BytesIO(content),mode="r:") as archive:
              members=archive.getmembers()
              for item in members:
                  if not item.isfile() or item.name.startswith("/") or ".." in pathlib.PurePosixPath(item.name).parts:
                      raise ValueError("Unsafe archive entry: "+item.name)
              archive.extractall(".",members=members,filter="data")
          PY
          chmod +x gradlew
          gradle wrapper --gradle-version 8.10.2
          rm -f .bootstrap/RMG-source.xz.b64 .github/workflows/bootstrap.yml
          rmdir .bootstrap .github/workflows .github 2>/dev/null || true
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Import complete RMG Share Android source"
          git push origin HEAD:main
